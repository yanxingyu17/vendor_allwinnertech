name: AI CI Failure Analysis (demo)

on:
  push:
    branches: [ai-ci-demo]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ai-analyze:
    runs-on: [self-hosted, openvela-ai]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Real compile (expected to fail), capture log
        run: |
          gcc -c test.c -o /tmp/test.o 2> build.log || true
          echo "===== build.log ====="
          cat build.log

      - name: AI analyze via local dsh
        shell: bash
        run: |
          set +e
          export PATH="/home/mi/.nvm/versions/node/v22.23.2/bin:$PATH"
          export DEEPSEEK_API_KEY=$(python3 -c "import json;print(json.load(open('/home/mi/.config/opencode/opencode.json'))['provider']['Mify-DeepSeek']['options']['apiKey'])")
          export DEEPSEEK_BASE_URL="https://api.llm.mioffice.cn/v1"
          export CHOKIDAR_USEPOLLING=1
          export CHOKIDAR_INTERVAL=1000
          LOG="$(cat build.log)"
          PROMPT="你是 openvela 社区 CI 的 AI 失败分析助手。下面是一次真实 CI 编译失败日志。用 ci-failure-analysis skill 分析,输出可直接贴 GitHub PR 的 Markdown 根因分析:一句话结论 + 根因(定位到文件/行) + 修复建议 + 这是AI生成需人工确认。200字内,中文。 ===日志=== ${LOG} ==="
          cd /home/mi/work/deepseek-harness
          timeout 240 pnpm dsh --profile openvela "$PROMPT" > "$GITHUB_WORKSPACE/ai-raw.txt" 2> "$GITHUB_WORKSPACE/ai-err.txt"
          DSH_CODE=$?
          echo ">>> dsh 退出码: $DSH_CODE"
          # 只取从第一个 Markdown 标题开始的正文，滤掉 pnpm 启动横幅噪声
          awk '/^#/{f=1} f' "$GITHUB_WORKSPACE/ai-raw.txt" > "$GITHUB_WORKSPACE/ai-out.txt"
          if [ ! -s "$GITHUB_WORKSPACE/ai-out.txt" ]; then
            echo "AI 分析无有效输出 (dsh 退出码 $DSH_CODE)" > "$GITHUB_WORKSPACE/ai-out.txt"
            tail -5 "$GITHUB_WORKSPACE/ai-err.txt" >> "$GITHUB_WORKSPACE/ai-out.txt" 2>/dev/null || true
          fi
          echo "===== 提取后的 AI 正文 ====="
          cat "$GITHUB_WORKSPACE/ai-out.txt"
          exit 0

      - name: Post comment to PR #1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set +e
          {
            echo "## 🤖 AI CI 失败分析（GitHub Actions 自动触发）"
            echo ""
            cat "$GITHUB_WORKSPACE/ai-out.txt"
            echo ""
            echo "---"
            echo "_self-hosted runner 上的 dsh 自动生成 · 由 github-actions[bot] 发出_"
          } > "$GITHUB_WORKSPACE/comment.md"
          # 修复:token 与正文文件路径都走参数,python 不碰 stdin(避免 heredoc/stdin 冲突)
          cat > "$GITHUB_WORKSPACE/post.py" <<'PY'
          import sys, json, urllib.request
          token, body_path = sys.argv[1], sys.argv[2]
          body = open(body_path, encoding="utf-8").read()
          req = urllib.request.Request(
              "https://api.github.com/repos/yanxingyu17/vendor_allwinnertech/issues/1/comments",
              data=json.dumps({"body": body}).encode(),
              headers={"Authorization": f"token {token}", "Accept": "application/vnd.github+json"},
              method="POST")
          try:
              r = urllib.request.urlopen(req)
              print("comment posted, HTTP", r.status)
          except Exception as e:
              print("comment failed:", e)
              try: print(e.read().decode())
              except Exception: pass
          PY
          python3 "$GITHUB_WORKSPACE/post.py" "$GH_TOKEN" "$GITHUB_WORKSPACE/comment.md"
          exit 0
